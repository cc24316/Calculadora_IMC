name: Projeto IMC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários com cobertura
        run: npm run test:unit -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  functional-tests:
    name: Testes Funcionais
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes funcionais
        run: npm run test:functional
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Upload de resultados dos testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-results
          path: |
            junit.xml
            test-results/
          retention-days: 7

  build-check:
    name: Verificação de Build
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar se o servidor inicia corretamente
        run: |
          node api/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
          echo "Servidor iniciou"

      - name: Pipeline concluída com sucesso
        run: |
          echo "Todos os testes passaram"
          echo "Testes unitários"
          echo "Testes funcionais"
          echo "Build check"